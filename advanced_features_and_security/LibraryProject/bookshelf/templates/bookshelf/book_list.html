<h1>Books</h1>

<form method="get">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Search</button>
</form>

<ul>
    {% for book in books %}
        <li>{{ book.title }} by {{ book.author }} ({{ book.published_date }})</li>
    {% empty %}
        <li>No books found.</li>
    {% endfor %}
</ul>

<a href="{% url 'create_book' %}">Add New Book</a>
